---
name: Agent bug finder

# yamllint disable-line rule:truthy
on:
  schedule:
    # Each area every 4 h, an hour apart: one finder run per hour overall.
    - cron: '0 0-23/4 * * *'  # apis
    - cron: '0 1-23/4 * * *'  # packages
    - cron: '0 2-23/4 * * *'  # ui
  workflow_dispatch:
    inputs:
      area:
        description: Area to review
        type: choice
        options: [apis, packages, ui]

# A run that outlasts its slot queues the next one for that area instead of
# overlapping it.
concurrency:
  group: agent-bug-finder-${{ inputs.area || github.event.schedule }}

permissions:
  contents: read

jobs:
  find:
    name: Find bugs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resolve area
        id: area
        env:
          AREA: ${{ inputs.area }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$AREA:$SCHEDULE" in
            apis:* | *:'0 0-23/4 * * *') area=apis ;;
            packages:* | *:'0 1-23/4 * * *') area=packages ;;
            ui:* | *:'0 2-23/4 * * *') area=ui ;;
            *) echo "::error::Unknown area '$AREA' / schedule '$SCHEDULE'"; exit 1 ;;
          esac
          echo "area=$area" >> "$GITHUB_OUTPUT"
      - name: Create agent token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - name: Agent setup
        id: setup
        uses: ./.github/actions/agent-setup
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          NODE_AUTH_TOKEN: ${{ secrets.TOOLKIT_HUB_PACKAGES }}
          prompt: bug-finder-${{ steps.area.outputs.area }}.md
      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          bot_id: ${{ steps.setup.outputs.bot-id }}
          bot_name: ${{ steps.setup.outputs.bot-name }}
          display_report: true
          prompt: ${{ steps.setup.outputs.prompt }}
          settings: '{"env":{"BASH_DEFAULT_TIMEOUT_MS":"600000"}}'
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,Skill,Task,TodoWrite"
