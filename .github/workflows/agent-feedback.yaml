---
name: Agent feedback

# The owner's comments on agent issues and reviews on agent PRs start a run
# right away, instead of waiting for the next scheduled resolver.
# yamllint disable-line rule:truthy
on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One run per issue or PR at a time; later comments queue behind it.
concurrency:
  group: agent-feedback-${{ github.event.issue.number || github.event.pull_request.number }}

permissions:
  contents: read

jobs:
  feedback:
    name: Act on owner feedback
    # The repo is public: only the owner's comments may start a run that holds
    # secrets. The agent's own comments come from its bot, so they never match.
    if: >-
      (github.event_name == 'issue_comment'
        && github.event.comment.user.login == 'radoslavirha'
        && (contains(github.event.issue.labels.*.name, 'agent-found')
          || contains(github.event.issue.labels.*.name, 'agent-todo')
          || contains(github.event.issue.labels.*.name, 'agent-pr')))
      || (github.event_name == 'pull_request_review'
        && github.event.review.user.login == 'radoslavirha'
        && contains(github.event.pull_request.labels.*.name, 'agent-pr')
        && (github.event.review.state != 'approved' || github.event.review.body != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Create agent token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Acknowledge comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null
      - name: Resolve target
        id: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ (github.event.issue.pull_request || github.event.pull_request) && 'true' || 'false' }}
        run: |
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          if [ "$IS_PR" = true ]; then
            echo "kind=pull request" >> "$GITHUB_OUTPUT"
            echo "ref=$(gh pr view "$NUMBER" -R "$GITHUB_REPOSITORY" --json headRefName -q .headRefName)" >> "$GITHUB_OUTPUT"
          else
            echo "kind=issue" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0
      - name: Agent setup
        id: setup
        uses: ./.github/actions/agent-setup
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          NODE_AUTH_TOKEN: ${{ secrets.TOOLKIT_HUB_PACKAGES }}
          prompt: feedback.md
      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          bot_id: ${{ steps.setup.outputs.bot-id }}
          bot_name: ${{ steps.setup.outputs.bot-name }}
          display_report: true
          prompt: |
            ${{ steps.setup.outputs.prompt }}

            # Trigger
            - Repository: ${{ github.repository }}
            - Target: ${{ steps.target.outputs.kind }} #${{ steps.target.outputs.number }}
            - Event: ${{ github.event_name }}
            - Comment or review id: ${{ github.event.comment.id || github.event.review.id }}
          settings: '{"env":{"BASH_DEFAULT_TIMEOUT_MS":"600000"}}'
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,Skill,Task,TodoWrite"
