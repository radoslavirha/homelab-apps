# nginx.conf — static fallback used when UNIFI_HOST is not set (bare nginx
# run without the template pipeline, e.g. local docker run without -e).
# The real production config is generated from nginx.conf.template at container
# start by the nginx image's built-in envsubst entrypoint.
#
# Deliberately has no /proxy/network/ block: with no UNIFI_HOST there is nothing
# to proxy to, and with no SECRET_UNIFI_API_KEY there would be no credential to
# attach. A bare `docker run` serves the SPA and /healthz only.

server {
    listen 80 default_server;
    # Explicit IPv6 listener. The base image's 10-listen-on-ipv6-by-default.sh
    # cannot do this for us: it patches the stock conf.d/default.conf at step 10,
    # and 20-envsubst-on-templates.sh then renders this template over the same
    # path, discarding the patch. `listen` is a server-block directive, so it
    # cannot live in the shared healthz.conf snippet either — keep these four
    # files identical by hand.
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same probe endpoint as the template, so a bare `docker run` behaves like
    # production rather than 404ing every probe.
    include /etc/nginx/snippets/healthz.conf;

    location = /config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Hashed build assets. A file the pod doesn't have (old hash after a release or
    # during a rollout) must be a 404, not index.html served as 200 text/html, which
    # the browser refuses as a module script (blank page).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        # index.html carries the current asset hashes, so it must revalidate on every load.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
