    '@tsed/platform-cache': ^8.44.0
    '@tsed/platform-exceptions': ^8.44.0
    '@tsed/platform-express': ^8.44.0
    '@tsed/platform-http': ^8.44.0
    '@tsed/platform-middlewares': ^8.44.0
    '@tsed/platform-params': ^8.44.0
    '@tsed/platform-response-filter': ^8.44.0
    '@tsed/platform-views': ^8.44.0
    '@tsed/schema': ^8.44.0
    '@tsed/swagger': ^8.44.0
    '@tsed/testcontainers-mongo': ^8.44.0
    ajv: ^8.20.0

injectWorkspacePackages: true

syncInjectedDepsAfterScripts:
  - build
allowBuilds:
  '@scarf/scarf': true
  '@swc/core': true
  cpu-features: false
  esbuild: true
  protobufjs: false
  sharp: true
  ssh2: false

minimumReleaseAgeExclude:
  - '@radoslavirha/*'
