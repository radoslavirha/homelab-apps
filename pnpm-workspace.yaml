  '@radoslavirha/config-tsdown': 0.2.7
  '@radoslavirha/config-typescript': ^1.1.8
  '@radoslavirha/config-vitest': ^0.4.10
  '@radoslavirha/redaction': ^0.3.8
  '@radoslavirha/tsed-common': ^0.7.1
  '@radoslavirha/tsed-configuration': ^0.9.4
  '@radoslavirha/tsed-logger': ^0.7.9
  '@radoslavirha/tsed-platform': ^6.0.1
  '@radoslavirha/tsed-swagger': ^9.1.16
  '@radoslavirha/utils': ^0.10.1
  '@radoslavirha/tsed-mongoose': ^5.1.2
  '@types/node': ^26.6.5
  '@types/supertest': ^7.2.1
  '@vitest/coverage-v8': ^5.0.5
  axios: ^1.20.0
  cockatiel: ^4.0.0
  cross-env: ^10.1.0
  esbuild: ^0.28.2
  eslint: ^10.13.0
  jose: ^6.2.12
  mongoose: 9.11.2
  nodemon: ^3.1.14
  supertest: ^7.3.1
  tsdown: 0.23.1
  tslib: ^2.8.1
  typescript: ^6.0.3
  typescript-eslint: ^8.71.2
  vitest: ^5.0.5
  zod: 4.6.7

catalogs:
  express:
    '@types/compression': ^1.8.1
    '@types/cookie-parser': ^1.4.10
    '@types/express': ^5.0.6
    '@types/multer': ^2.3.0
    body-parser: ^2.3.0
    compression: ^1.8.2
    cookie-parser: ^1.4.7
    express: ^5.3.0
  otel:
    '@opentelemetry/api': ^1.9.1
    '@opentelemetry/core': ^2.12.0
    '@opentelemetry/exporter-logs-otlp-http': ^0.223.0
    '@opentelemetry/exporter-metrics-otlp-http': ^0.223.0
