  react:
    # vitest/@vitest+coverage-v8 pinned to 4.x: jest-dom@7.0.1's vitest.d.ts
    # augments Assertion<T=any>, but vitest 5 changed it to Assertion<R,T>
    # (2 required params) — merge fails, matcher types vanish. Bump once
    # jest-dom ships vitest-5-compatible types.
    '@testing-library/jest-dom': ^7.0.1
    '@testing-library/react': ^16.3.3
    '@testing-library/user-event': ^14.6.8
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    '@vitejs/plugin-react': ^6.1.2
    '@vitest/coverage-v8': ^5.0.5
    jsdom: ^30.1.3
    oidc-client-ts: ^3.5.0
    react: ^19.3.1
    react-dom: ^19.3.1
    react-router-dom: ^7.18.4
    vite: ^8.3.4
    vitest: ^5.0.5
  swc:
    '@swc-node/register': ^1.12.1
    '@swc/cli': ^0.8.1
    '@swc/core': ^1.16.18
    '@swc/helpers': ^0.5.23
  tsed:
    '@tsed/ajv': ^8.44.0
    '@tsed/core': ^8.44.0
    '@tsed/di': ^8.44.0
