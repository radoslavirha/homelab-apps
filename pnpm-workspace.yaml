allowBuilds:
  '@scarf/scarf': true
  '@swc/core': true
  cpu-features: false
  esbuild: true
  protobufjs: false
  sharp: true
  ssh2: false

minimumReleaseAgeExclude:
  - '@radoslavirha/*'
